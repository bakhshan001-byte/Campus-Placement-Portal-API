# Server Port Configuration for Render
server.port=${PORT:8080}

# H2 Database Settings (In-Memory Database for Live Demo)
spring.datasource.url=jdbc:h2:mem:campus_placement_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# EMAIL CONFIGURATION (JavaMailSender)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Yahan apni asli Gmail ID likhein (Jaise: abc@gmail.com)
spring.mail.username=aapki.asli.id@gmail.com 

# Yahan Google ka 16-digit App Password likhein bina space ke
spring.mail.password=yahan_16_digit_app_password_likhein

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
